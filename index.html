<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Urban Living Dashboard</title>
  
  <!-- Tailwind CSS with Typography plugin -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  
  <!-- Custom Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: '#818cf8', // A softer indigo for better contrast on dark backgrounds
            'text-main': '#f1f5f9', // slate-100
            'text-secondary': '#94a3b8', // slate-400
            'bg-primary': '#0f172a', // slate-900
            'bg-secondary': 'rgba(30, 41, 59, 0.5)', // slate-800 with opacity for glass effect
            'border-color': 'rgba(100, 116, 139, 0.3)', // slate-500 with opacity
          },
          animation: {
            'fade-in-up': 'fade-in-up 0.6s ease-out forwards',
            'fade-in-down': 'fade-in-down 0.6s ease-out forwards',
            'fade-in': 'fade-in 0.5s ease-out forwards',
            'background-pan': 'background-pan 15s ease infinite',
            'subtle-pulse': 'subtle-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            'fade-in-up': {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            'fade-in-down': {
              '0%': { opacity: '0', transform: 'translateY(-20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            'fade-in': {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            'background-pan': {
              '0%': { backgroundPosition: '0% 50%' },
              '50%': { backgroundPosition: '100% 50%' },
              '100%': { backgroundPosition: '0% 50%' },
            },
            'subtle-pulse': {
              '0%, 100%': { opacity: 1 },
              '50%': { opacity: 0.5 },
            }
          }
        }
      }
    }
  </script>

  <script type="importmap">
  {
    "imports": {
      "react": "https://aistudiocdn.com/react@^19.2.0",
      "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
      "react/": "https://aistudiocdn.com/react@^19.2.0/",
      "@google/genai": "https://aistudiocdn.com/@google/genai@^1.22.0",
      "recharts": "https://aistudiocdn.com/recharts@^3.2.1",
      "@react-google-maps/api": "https://aistudiocdn.com/@react-google-maps/api@^2.20.7"
    }
  }
  </script>

  <script type="module" src="/index.tsx"></script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="root"></div>
  <noscript>You need to enable JavaScript to run this app.</noscript>
</body>
</html>
